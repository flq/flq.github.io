version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # One PR per month for all minor/patch bumps;
      # major versions still get their own PR so breaking changes stand out.
      npm-minor-patch:
        update-types: [minor, patch]
      # Security fixes for transitive deps in one PR as well
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
